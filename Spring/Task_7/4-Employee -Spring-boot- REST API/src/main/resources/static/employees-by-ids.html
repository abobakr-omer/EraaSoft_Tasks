<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employees By IDs</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <div>
        <a class="back-link" href="index.html">
            &larr; Back to Operations
        </a>

        <h1>Get Employees By IDs</h1>

        <p>GET /employee/all-employees-By-Ids/{ids}</p>
    </div>
</header>


<main class="container">

    <section class="card">

        <div class="card-header">

            <div>
                <h2>Employee IDs</h2>
                <p>
                    Enter multiple IDs separated by commas.
                    Example: 1,2,3
                </p>
            </div>

        </div>


        <form id="idsForm">

            <div class="search-area">

                <label class="hidden" for="idsInput">
                    Employee IDs
                </label>

                <input
                        type="text"
                        id="idsInput"
                        placeholder="1,2,3"
                        required
                >


                <button
                        type="submit"
                        class="btn btn-primary"
                >
                    Get By IDs
                </button>

            </div>

        </form>


        <div id="message"></div>


        <div class="table-wrapper">

            <table>

                <thead>

                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Phone Number</th>
                    <th>Actions</th>
                </tr>

                </thead>


                <tbody id="employeeTable">

                </tbody>

            </table>

        </div>


        <div id="emptyState" class="empty-state hidden">

            No employees found.

        </div>


        <div class="page-links">

            <a class="btn btn-secondary" href="all-employees.html">
                Show All Employees
            </a>

            <a class="btn btn-secondary" href="index.html">
                Back to Operations
            </a>

        </div>

    </section>

</main>


<script src="common.js"></script>
<script src="employees-by-ids.js"></script>

</body>
</html>
