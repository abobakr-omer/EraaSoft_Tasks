<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Player</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <div>
        <a class="back-link" href="index.html">
            &larr; Back to Operations
        </a>

        <h1>Add Player</h1>

        <p>POST /save-player</p>
    </div>
</header>


<main class="container">

    <section class="card">

        <div class="card-header">

            <div>
                <h2>New Player</h2>
                <p>
                    A new player is created without an ID.
                    The database generates it.
                </p>
            </div>

        </div>


        <form id="addForm">

            <div class="form-grid">

                <div class="form-group">
                    <label for="playerName">
                        Name
                    </label>

                    <input
                            type="text"
                            id="playerName"
                            placeholder="Player name"
                            maxlength="255"
                            required
                    >
                </div>


                <div class="form-group">
                    <label for="playerNumber">
                        Player Number
                    </label>

                    <input
                            type="number"
                            id="playerNumber"
                            placeholder="10"
                            min="0"
                            required
                    >
                </div>


                <div class="form-group">
                    <label for="playerSalary">
                        Salary
                    </label>

                    <input
                            type="number"
                            id="playerSalary"
                            placeholder="50000"
                            min="0"
                            step="0.01"
                            required
                    >
                </div>

            </div>


            <div class="button-group">

                <button
                        type="submit"
                        class="btn btn-primary"
                >
                    Add Player
                </button>


                <button
                        type="reset"
                        class="btn btn-secondary"
                >
                    Clear
                </button>

            </div>

        </form>


        <div id="message"></div>


        <div id="resultPanel" class="result-panel hidden">

            <h3>Created Player</h3>

            <pre class="json" id="resultJson"></pre>

        </div>


        <div class="page-links">

            <a class="btn btn-secondary" href="all-players.html">
                Show All Players
            </a>

            <a class="btn btn-secondary" href="index.html">
                Back to Operations
            </a>

        </div>

    </section>

</main>


<script src="common.js"></script>
<script src="add-player.js"></script>

</body>
</html>
