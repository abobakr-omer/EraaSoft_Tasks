<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Player</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <div>
        <a class="back-link" href="index.html">
            &larr; Back to Operations
        </a>

        <h1>Delete Player</h1>

        <p>DELETE /delete-player/{id}</p>
    </div>
</header>


<main class="container">

    <!-- ================================================= -->
    <!-- STEP 1 : PREVIEW THE PLAYER -->
    <!-- ================================================= -->

    <section class="card">

        <div class="card-header">

            <div>
                <h2>Step 1 — Find Player</h2>
                <p>
                    Load the player first so you can confirm
                    what will be deleted.
                </p>
            </div>

        </div>


        <form id="loadForm">

            <div class="search-area">

                <label class="hidden" for="loadId">
                    Player ID
                </label>

                <input
                        type="number"
                        id="loadId"
                        placeholder="Player ID"
                        min="1"
                        required
                >


                <button
                        type="submit"
                        class="btn btn-primary"
                >
                    Load Player
                </button>

            </div>

        </form>


        <div id="message"></div>

    </section>


    <!-- ================================================= -->
    <!-- STEP 2 : CONFIRM -->
    <!-- ================================================= -->

    <section id="confirmCard" class="card danger-zone hidden">

        <div>

            <h2>Step 2 — Confirm Deletion</h2>

            <p id="confirmText">
                This player will be permanently removed.
            </p>

        </div>


        <button
                id="deleteButton"
                class="btn btn-danger"
        >
            Delete Player
        </button>

    </section>


    <section class="card">

        <div id="previewPanel" class="table-wrapper hidden">

            <table>

                <thead>

                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Number</th>
                    <th>Salary</th>
                </tr>

                </thead>


                <tbody id="playerTable">

                </tbody>

            </table>

        </div>


        <div class="page-links">

            <a class="btn btn-secondary" href="all-players.html">
                Show All Players
            </a>

            <a class="btn btn-secondary" href="index.html">
                Back to Operations
            </a>

        </div>

    </section>

</main>


<script src="common.js"></script>
<script src="delete-player.js"></script>

</body>
</html>
